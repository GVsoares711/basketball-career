
<style>
*{box-sizing:border-box}

body{
  margin:0;
  color:#222;
  background:#fff;
  font:12px Arial,Helvetica,sans-serif
}

a{color:#174f82;text-decoration:none}
a:hover{text-decoration:underline}

header{
  background:#263f5b;
  color:white;
  padding:18px max(16px,calc((100% - 1150px)/2))
}
header h1{font-size:27px;margin:0 0 7px}
header p{margin:0;color:#dce6f0}

nav{
  background:#e9eef3;
  border-bottom:1px solid #bbc6d1;
  padding:11px max(16px,calc((100% - 1150px)/2));
  display:flex;
  gap:17px;
  flex-wrap:wrap
}
nav a{font-weight:bold}

main{
  max-width:1150px;
  margin:20px auto;
  padding:0 12px;
  min-width:0
}

h2{font-size:21px;margin:0 0 12px}
h3{
  font-size:17px;
  margin:27px 0 10px;
  padding-bottom:6px;
  border-bottom:2px solid #263f5b
}
h4{font-size:14px;margin:15px 0 8px}
p{line-height:1.5}

.profile{
  display:flex;
  gap:20px;
  align-items:center;
  padding:8px 0 18px;
  border-bottom:2px solid #263f5b
}
.photo{
  width:115px;
  height:135px;
  padding:0;
  overflow:hidden;
  flex-shrink:0;
  background:#e9edf1;
  border:1px solid #c5cdd5
}
.photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  display:block
}
.profile-info{flex:1;min-width:180px}
.profile-info p{margin:5px 0;line-height:1.6}

.team-jerseys{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap
}
.jersey-card{
  position:relative;
  text-align:center;
  min-width:48px;
  cursor:help
}
.jersey-card svg{
  display:block;
  width:43px;
  height:53px;
  margin:0 auto 4px;
  transition:transform .15s ease
}
.jersey-card:hover svg,
.jersey-card:focus-within svg{
  transform:translateY(-3px)
}
.jersey-label{font-size:11px;font-weight:bold;color:#444}

.jersey-card::after{
  content:attr(data-years);
  position:absolute;
  left:50%;
  bottom:calc(100% + 7px);
  transform:translateX(-50%) translateY(4px);
  background:#263f5b;
  color:#fff;
  padding:7px 9px;
  border-radius:3px;
  font-size:12px;
  line-height:1.3;
  white-space:nowrap;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  z-index:5;
  transition:opacity .15s ease,transform .15s ease,visibility .15s ease;
  box-shadow:0 2px 5px #0002
}
.jersey-card:hover::after,
.jersey-card:focus-within::after{
  opacity:1;
  visibility:visible;
  transform:translateX(-50%) translateY(0)
}
.jersey-card:focus-within{
  outline:2px solid #174f82;
  outline-offset:3px
}
.jersey-number{
  font-family:Arial,Helvetica,sans-serif;
  font-size:19px;
  font-weight:bold;
  fill:white;
  text-anchor:middle
}

.muted{color:#666}
.notice{
  background:#fff7df;
  border:1px solid #e4d49d;
  padding:10px;
  margin-bottom:17px;
  line-height:1.5
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:9px;
  margin:16px 0
}
.stat{
  border:1px solid #c9d1da;
  background:#f6f8fa;
  padding:11px
}
.stat strong{
  display:block;
  font-size:21px;
  color:#263f5b;
  margin-bottom:4px
}
.stat span{color:#555}

/* TABLES: fit the entire table to the page */
.table-wrap{
  width:100%;
  max-width:100%;
  overflow:visible;
  margin:8px 0 13px
}

table{
  border-collapse:collapse;
  width:100%;
  max-width:100%;
  table-layout:fixed;
  font-size:10px;
  white-space:normal;
  overflow-wrap:anywhere
}

th{
  background:#e8edf2;
  border-top:1px solid #aebac6;
  border-bottom:1px solid #aebac6;
  padding:0;
  text-align:right;
  overflow-wrap:anywhere
}

th button{
  font:inherit;
  font-weight:bold;
  color:#222;
  background:transparent;
  border:0;
  padding:5px 1px;
  width:100%;
  cursor:pointer;
  white-space:normal;
  overflow-wrap:anywhere;
  line-height:1.15
}

th button:hover{background:#d5e0eb}
th button:focus-visible{
  outline:2px solid #174f82;
  outline-offset:-2px
}

th:first-child{text-align:left}

td{
  border-bottom:1px solid #d8dfe6;
  padding:5px 2px;
  text-align:right;
  overflow-wrap:anywhere;
  word-break:normal;
  line-height:1.2
}
td:first-child{text-align:left}

tbody tr:nth-child(even){background:#f4f6f8}
tbody tr:hover{background:#edf3f8}

tfoot{
  font-weight:bold;
  background:#e8edf2
}
tfoot td{
  border-top:2px solid #263f5b;
  border-bottom:1px solid #aebac6
}

.note{color:#666;font-size:11px}

.stat-tabs{
  display:flex;
  gap:4px;
  border-bottom:2px solid #263f5b;
  margin:12px 0 10px
}
.stat-tab{
  appearance:none;
  border:1px solid #c5cdd5;
  border-bottom:0;
  border-radius:4px 4px 0 0;
  padding:10px 18px;
  background:#e9eef3;
  color:#263f5b;
  font:bold 13px Arial,Helvetica,sans-serif;
  cursor:pointer
}
.stat-tab:hover{background:#dbe4ed}
.stat-tab[aria-selected="true"]{
  background:#263f5b;
  color:white;
  border-color:#263f5b
}
.stat-tab:focus-visible{
  outline:2px solid #174f82;
  outline-offset:2px
}
.stat-panel[hidden]{display:none}

.awards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin:14px 0 20px
}
.award{
  border:1px solid #c8d1da;
  border-top:4px solid #263f5b;
  background:#f7f9fb;
  padding:12px;
  min-height:85px;
  text-align:center
}
.award strong{
  display:block;
  color:#263f5b;
  font-size:22px;
  margin-bottom:6px
}
.award span{line-height:1.5;color:#555}

.team-list{
  border:1px solid #d4dbe2;
  padding:11px;
  margin:7px 0
}
.section-links{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:12px 0
}
.section-links a{
  border:1px solid #c7d0da;
  padding:7px 10px;
  background:#f6f8fa
}

footer{
  background:#263f5b;
  color:white;
  text-align:center;
  padding:20px;
  margin-top:35px;
  line-height:1.7
}

@media(max-width:800px){
  main{padding:0 6px}

  table{font-size:8px}

  th button{padding:4px 0}
  td{padding:4px 1px}

  .summary{gap:5px}
  .stat{padding:8px}
  .stat strong{font-size:18px}

  .awards{gap:6px}
  .award{padding:8px}
}

@media(max-width:500px){
  header h1{font-size:22px}
  nav{gap:12px}

  .profile{
    align-items:flex-start;
    flex-wrap:wrap
  }

  .photo{width:85px;height:110px}
  .profile-info{flex:1;min-width:0}

  .team-jerseys{
    width:100%;
    justify-content:flex-start;
    margin-top:8px
  }

  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .awards{grid-template-columns:repeat(2,minmax(0,1fr))}

  table{font-size:7px}
  th button{font-size:7px}
  td{padding:3px 0}

  .stat-tab{padding:9px 13px}
}

@media(max-width:350px){
  .awards{grid-template-columns:1fr}
}
</style>
